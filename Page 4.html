<div class="container">
    <p class="lead text-center" style="font-size: 60px; color: white;" fw-bold text-info>Student Enrollment Form</p>
    <br>
    <blockquote>
        <span class="fst-italic" style="color: white; background-color: rgb(0, 18, 151);" id="Description">Enroll now by submitting the required details and documents. We welcome all to study the montessori way.
    </blockquote>
</div>



<div class="container">
  <form class="row g-3 transparent-bg">
    <div class="col-md-6">
      <label class="form-label">Full Name</label>
      <input type="text" class="form-control" required>
    </div>

    <div class="col-md-6">
      <label class="form-label">Gender</label>
      <input type="text" class="form-control" required>
    </div>

    <div class="col-12">
      <p class="lead text-center" style="font-size: 30px; color: black;">Contact Details</p>
    </div>

    <div class="col-md-6">
      <label class="form-label">Email</label>
      <input type="email" class="form-control" required>
    </div>

    <div class="col-md-6">
      <label class="form-label">Contact Number</label>
      <input type="text" class="form-control" required>
    </div>

    <div class="col-md-6">
      <label class="form-label">Date of Birth</label>
      <input type="date" class="form-control" required>
    </div>

<div class="col-md-6">
  <label class="form-label">Grade Level</label>
  <select class="form-control" required>
    <option value="" disabled selected>Select Grade Level</option>
    <option value="Casa">Casa</option>
    <option value="Junior Casa">Junior Casa</option>
    <option value="Junior Advanced Casa">Junior Advanced Casa</option>
    <option value="Advanced Casa">Advanced Casa</option>
    <option value="1">1st Grade</option>
    <option value="2">2nd Grade</option>
    <option value="3">3rd Grade</option>
    <option value="4">4th Grade</option>
    <option value="5">5th Grade</option>
    <option value="6">6th Grade</option>
    <option value="7">7th Grade</option>
    <option value="8">8th Grade</option>
    <option value="9">9th Grade</option>
    <option value="10">10th Grade</option>
    <option value="11">11th Grade</option>
    <option value="12">12th Grade</option>
  </select>
</div>

<div class="col-md-6">
<button type="Submit" id="Submit">Submit Form</button>
</div>
